stages:
  - build
  - test


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


gradle-build-jar:
  artifacts:
    name: JAR file
    paths:
      - ./build/libs/CodeNarc-*-all.jar
  image: gradle:7.6-jdk11-alpine
  script:
    - gradle --no-daemon shadowJar
    - ls .
    - ls ./build
    - ls ./build/libs
  stage: build

selftest:
  artifacts:
    name: $CI_JOB_NAME artifacts from $CI_PROJECT_NAME on $CI_COMMIT_REF_SLUG
    reports:
      codequality:
        - dummy-report.json
    when: always
  image: openjdk:11-jre-slim
  needs: [gradle-build-jar]
  script:
    - ls .
    - ls ./build
    - ls ./build/libs
    - java -jar ./build/libs/CodeNarc-*-all.jar -report=gitlab:./dummy-report.json
  stage: test